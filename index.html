<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 성경 — 신약 책·장·절 찾기</title><style>
:root{color-scheme:light;--green:#177245}*{box-sizing:border-box}body{margin:0;background:#fbfaf7;color:#292621;font:16px system-ui,sans-serif}header,main{max-width:1080px;margin:auto;padding:20px}h1{font-size:25px;margin:0 0 6px}.muted{color:#6b665e;font-size:14px;line-height:1.6}form,.selectors{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:18px}label{display:flex;flex-direction:column;gap:5px;font-weight:600}input,select,button,.direct{font:inherit;min-height:46px;padding:10px 13px;border:1px solid #d5cec3;border-radius:8px;background:white}#reference{flex:1;min-width:210px}button{cursor:pointer}button.primary{background:var(--green);color:white;border-color:var(--green)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #84b9a0;outline-offset:2px}#verse{width:96px}#notice{padding:12px 14px;border:1px solid #ded8ce;border-radius:8px;background:#f3f0e9;line-height:1.65;margin-top:16px;min-height:48px}#notice.error{color:#a12820}#chapters{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}#chapters button{min-width:47px}#chapters button.active{border:2px solid var(--green);color:var(--green);font-weight:700}#chapters button.ready{background:#e8f1eb}#chapters button.pending{color:#777}#reader{width:100%;height:75vh;min-height:440px;border:1px solid #ded8ce;border-radius:10px;background:white}#reader[hidden]{display:none}.readerhead{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:20px 0 10px}.direct{color:var(--green);text-decoration:none;font-size:14px}details{margin-top:20px}#booklist{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-top:12px}#booklist button{text-align:left}small{display:block;color:#777;font-size:12px;margin-top:3px}@media(max-width:520px){header,main{padding:15px}h1{font-size:21px}.selectors label:first-child{width:100%}#book{width:100%}#reader{height:78vh}.readerhead{align-items:flex-start}}

</style></head><body><header><h1>나의 성경 — 책·장·절 찾기</h1><div class="muted">Greek NT Reader · Greek Text Only · 마태복음–요한계시록</div><button id="menuToggle" class="menu-toggle" type="button" aria-expanded="true" aria-controls="menuContent">본문 위 모두 접기 ▲</button><div id="menuContent" class="menu-content"><form id="search"><input id="reference" aria-label="성경 주소" placeholder="예: 요 5:24 · 마태복음 5장 3절 · John 3:16" autocomplete="off"><button class="primary" type="submit">찾기</button></form><div class="selectors"><label>책<select id="book"></select></label><label>장<select id="chapter"></select></label><label>절<input id="verse" type="number" min="1" step="1" value="1" inputmode="numeric"></label><button id="go" class="primary" type="button">이동</button><button id="prev" type="button" aria-label="이전 장">이전 장</button><button id="next" type="button" aria-label="다음 장">다음 장</button></div><div id="notice" role="status" aria-live="polite"></div><div id="chapters" aria-label="장 선택"></div><details><summary>신약 27권 보기 · 연결 현황</summary><div id="booklist"></div></details></div></header><main><div class="readerhead"><strong id="location">책과 장을 선택하세요</strong><a id="direct" class="direct" hidden target="_blank" rel="noopener">본문만 새 창에서 열기</a></div><iframe id="reader" title="성경 본문" hidden></iframe><p class="muted">요한복음 1–21장과 갈라디아서 1–6장 파일을 연결했습니다. 다른 책의 기존 작업은 보존하며 이 첫 화면에는 아직 연결하지 않았습니다. 완성한 장을 차례로 연결합니다. 1장 기존본은 원문을 불러올 때 인터넷 연결이 필요합니다.</p></main><script>
'use strict';const BOOKS=[["MAT", "마태복음", "Matthew", "마,마태,마태복음,mt,matt", 28, "matthew"], ["MRK", "마가복음", "Mark", "막,마가,마가복음,mk,mrk", 16, "mark"], ["LUK", "누가복음", "Luke", "눅,누가,누가복음,lk", 24, "luke"], ["JHN", "요한복음", "John", "요,요한,요한복음,jn,joh", 21, "john"], ["ACT", "사도행전", "Acts", "행,사도행전,사도,ac", 28, "acts"], ["ROM", "로마서", "Romans", "롬,로마,로마서,ro,rom", 16, "romans"], ["1CO", "고린도전서", "1 Corinthians", "고전,고린도전서,1cor,1corinthians", 16, "1_corinthians"], ["2CO", "고린도후서", "2 Corinthians", "고후,고린도후서,2cor,2corinthians", 13, "2_corinthians"], ["GAL", "갈라디아서", "Galatians", "갈,갈라디아,갈라디아서,ga", 6, "galatians"], ["EPH", "에베소서", "Ephesians", "엡,에베소,에베소서,ep", 6, "ephesians"], ["PHP", "빌립보서", "Philippians", "빌,빌립보,빌립보서,phil,philip", 4, "philippians"], ["COL", "골로새서", "Colossians", "골,골로새,골로새서,co", 4, "colossians"], ["1TH", "데살로니가전서", "1 Thessalonians", "살전,데살로니가전서,1thess,1thessalonians", 5, "1_thessalonians"], ["2TH", "데살로니가후서", "2 Thessalonians", "살후,데살로니가후서,2thess,2thessalonians", 3, "2_thessalonians"], ["1TI", "디모데전서", "1 Timothy", "딤전,디모데전서,1tim,1timothy", 6, "1_timothy"], ["2TI", "디모데후서", "2 Timothy", "딤후,디모데후서,2tim,2timothy", 4, "2_timothy"], ["TIT", "디도서", "Titus", "딛,디도,디도서,ti", 3, "titus"], ["PHM", "빌레몬서", "Philemon", "몬,빌레몬,빌레몬서,phile", 1, "philemon"], ["HEB", "히브리서", "Hebrews", "히,히브리,히브리서,he", 13, "hebrews"], ["JAS", "야고보서", "James", "약,야고보,야고보서,ja", 5, "james"], ["1PE", "베드로전서", "1 Peter", "벧전,베드로전서,1pet,1peter", 5, "1_peter"], ["2PE", "베드로후서", "2 Peter", "벧후,베드로후서,2pet,2peter", 3, "2_peter"], ["1JN", "요한일서", "1 John", "요일,요한일서,1jn,1john", 5, "1_john"], ["2JN", "요한이서", "2 John", "요이,요한이서,2jn,2john", 1, "2_john"], ["3JN", "요한삼서", "3 John", "요삼,요한삼서,3jn,3john", 1, "3_john"], ["JUD", "유다서", "Jude", "유,유다,유다서,jud", 1, "jude"], ["REV", "요한계시록", "Revelation", "계,계시록,요한계시록,rev,revelations", 22, "revelation"]];const FILES={"JHN":{"5":"john_5_golden_master_offline.html","6":"john_6_golden_master_offline.html","7":"john_7_golden_master_offline.html","8":"john_8_golden_master_offline.html","9":"john_9_golden_master_offline.html","10":"john_10_golden_master_offline.html","11":"john_11_golden_master_offline.html","12":"john_12_golden_master_offline.html","13":"john_13_golden_master_offline.html","14":"john_14_golden_master_offline.html","15":"john_15_golden_master_offline.html","16":"john_16_golden_master_offline.html","17":"john_17_golden_master_offline.html","18":"john_18_golden_master_offline.html","19":"john_19_golden_master_offline.html","20":"john_20_golden_master_offline.html","21":"john_21_golden_master_offline.html","1":"john_1_golden_master_v1_5_variant_layers.html","2":"john_2_golden_master_v1_5_audio_restored.html","3":"john_3_golden_master_offline_v3_1_audio_restored.html","4":"john_4_golden_master_offline_v4_0.html"},"GAL":{"1":"galatians_1_pauline_golden_master_v1_0.html","2":"galatians_2_pauline_golden_master.html","3":"galatians_3_pauline_golden_master.html","4":"galatians_4_pauline_golden_master.html","5":"galatians_5_pauline_golden_master.html","6":"galatians_6_pauline_golden_master.html"}};
const $=id=>document.getElementById(id),book=$('book'),chapter=$('chapter'),verse=$('verse'),reader=$('reader');let observer=null,loadSerial=0;
const menuToggle=$('menuToggle'),menuContent=$('menuContent');
function setMenuCollapsed(collapsed){menuContent.hidden=collapsed;document.body.classList.toggle('reading',collapsed);menuToggle.setAttribute('aria-expanded',String(!collapsed));menuToggle.textContent=collapsed?'메뉴 펼치기 ▼':'본문 위 모두 접기 ▲';try{localStorage.setItem('myBibleMenuCollapsed',collapsed?'1':'0')}catch(e){}}
menuToggle.onclick=()=>setMenuCollapsed(!menuContent.hidden);
try{setMenuCollapsed(localStorage.getItem('myBibleMenuCollapsed')==='1')}catch(e){}
const norm=s=>s.toLowerCase().replace(/[\s._-]/g,'');
const aliases=new Map;BOOKS.forEach(b=>[b[0],b[1],b[2],...b[3].split(',')].forEach(a=>aliases.set(norm(a),b[0])));
function info(id){return BOOKS.find(b=>b[0]===id)}
function notify(s,error=false){$('notice').textContent=s;$('notice').classList.toggle('error',error)}
function fillChapters(c=1){const b=info(book.value);chapter.replaceChildren();for(let n=1;n<=b[4];n++){const o=new Option(n+'장',n);chapter.add(o)}chapter.value=String(c);drawChapters()}
function drawChapters(){const b=info(book.value);$('chapters').replaceChildren();for(let n=1;n<=b[4];n++){const ready=!!FILES[b[0]]?.[n],bt=document.createElement('button');bt.type='button';bt.textContent=n;bt.className=(ready?'ready':'pending')+(n===Number(chapter.value)?' active':'');bt.title=n+'장 · '+(ready?'연결됨':'연결 준비');bt.setAttribute('aria-label',bt.title);bt.setAttribute('aria-pressed',String(n===Number(chapter.value)));bt.onclick=()=>{chapter.value=n;verse.value=1;openReference()};$('chapters').append(bt)}}
function parseReference(input){let s=input.trim().replace(/：/g,':');let m=s.match(/^(.+?)\s*(\d+)\s*(?:장\s*(\d+)\s*절?|[:.]\s*(\d+)\s*절?|장)?\s*$/i);if(!m)return null;const id=aliases.get(norm(m[1]));if(!id)return null;return {id,c:Number(m[2]),v:Number(m[3]||m[4]||1)}}
function validate(id,c,v){const b=info(id);return b&&Number.isInteger(c)&&c>=1&&c<=b[4]&&Number.isInteger(v)&&v>=1}
function locate(doc,v){return doc.querySelector('[data-verse="'+v+'"]')||[...doc.querySelectorAll('.verse')].find(e=>Number(e.querySelector('.vn')?.textContent)===v)||doc.getElementById('v'+v)||doc.getElementById('verse-'+v)}
function openReference(save=true){const id=book.value,c=Number(chapter.value),v=Number(verse.value);if(!validate(id,c,v)){notify('책·장·절을 확인하세요. 절은 1 이상의 정수로 입력합니다.',true);return}const b=info(id),file=FILES[id]?.[c],serial=++loadSerial;if(observer){observer.disconnect();observer=null}drawChapters();$('location').textContent=b[1]+' '+c+'장 '+v+'절';if(save){const u=new URL(location.href);u.searchParams.set('book',id);u.searchParams.set('chapter',c);u.searchParams.set('verse',v);history.replaceState(null,'',u)}if(!file){reader.hidden=true;reader.removeAttribute('src');$('direct').hidden=true;notify(b[1]+' '+c+'장은 이 검색기에 아직 연결하지 않았습니다. 완성 파일이 연결되면 여기에서 열 수 있습니다.');return}reader.hidden=false;$('direct').hidden=false;$('direct').href=file;notify(b[1]+' '+c+'장을 여는 중입니다.');reader.onload=()=>{if(serial!==loadSerial)return;let doc;try{doc=reader.contentDocument;if(!doc)throw Error('different origin')}catch(e){notify('기기에서 절 위치 접근을 허용하지 않습니다. 본문만 새 창에서 열기로 읽으세요.');return}if(!doc.querySelector('.verse')&&!doc.querySelector('#text')){notify('본문 파일을 찾지 못했습니다. 이 index.html과 장 HTML 파일을 같은 폴더에 올려 주세요.',true);return}const seek=()=>{if(serial!==loadSerial)return false;const target=locate(doc,v);if(!target)return false;doc.defaultView.scrollTo({top:target.getBoundingClientRect().top+doc.defaultView.scrollY-8,behavior:'instant'});target.style.outline='2px solid #177245';target.style.outlineOffset='5px';notify(b[1]+' '+c+'장 '+v+'절로 이동했습니다.');if(observer)observer.disconnect();return true};if(seek())return;observer=new MutationObserver(()=>{if(seek())observer=null});observer.observe(doc.body,{childList:true,subtree:true});setTimeout(()=>{if(serial!==loadSerial)return;if(observer){observer.disconnect();observer=null}if(!locate(doc,v))notify(doc.querySelector('.verse')?'이 장에서 '+v+'절을 찾지 못했습니다. 절 번호를 확인하세요.':'본문 로드를 기다리고 있습니다. 1장은 인터넷 연결을 확인하세요.',true)},15000)};reader.src=file}
BOOKS.forEach(b=>book.add(new Option(b[1]+' · '+b[2],b[0])));BOOKS.forEach(b=>{const bt=document.createElement('button');bt.type='button';const title=document.createElement('span');title.textContent=b[1];const detail=document.createElement('small');const ready=Object.keys(FILES[b[0]]||{}).length;detail.textContent=ready+' / '+b[4]+'장 연결';bt.append(title,detail);bt.onclick=()=>{book.value=b[0];fillChapters();verse.value=1;openReference()};$('booklist').append(bt)});
book.onchange=()=>{fillChapters();verse.value=1;openReference()};chapter.onchange=()=>{verse.value=1;openReference()};$('go').onclick=()=>openReference();$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);function step(d){const c=Number(chapter.value)+d;if(c<1||c>info(book.value)[4]){notify('이 책의 '+(d<0?'첫':'마지막')+' 장입니다.');return}chapter.value=c;verse.value=1;openReference()}
$('search').onsubmit=e=>{e.preventDefault();const p=parseReference($('reference').value);if(!p||!validate(p.id,p.c,p.v)){notify('성경 주소를 확인하세요. 예: 요 5:24 / 마태복음 5장 3절 / 1 Corinthians 13:4',true);return}book.value=p.id;fillChapters(p.c);verse.value=p.v;openReference()};
const params=new URLSearchParams(location.search),id=params.get('book')||'JHN',c=Number(params.get('chapter')||1),v=Number(params.get('verse')||1);if(validate(id,c,v)){book.value=id;fillChapters(c);verse.value=v;openReference(false)}else{book.value='JHN';fillChapters();notify('주소의 책·장·절이 올바르지 않습니다.',true)}
</script></body></html>
